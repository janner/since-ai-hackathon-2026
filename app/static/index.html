<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaista - IFIC-triage</title>
<style>
  /* IBM Carbon: white canvas, one blue accent, 8px rhythm, no shadows, no radius. */
  :root {
    --bg: #ffffff; --fg: #161616; --muted: #525252; --line: #e0e0e0;
    --surface: #f4f4f4; --accent: #0f62fe; --accent-hover: #0043ce; --accent-tint: #edf5ff;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', 'Liberation Sans', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 400 16px/1.5 var(--sans); font-variant-numeric: tabular-nums;
  }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3; }
  .sub { margin: 8px 0 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
  .funnel-line { margin: 8px 0 0; font-size: 14px; line-height: 1.4; }
  .status { margin: 8px 0 0; font-size: 14px; line-height: 1.4; color: var(--accent); }
  .status:empty { display: none; }
  .fetch { display: flex; align-items: center; gap: 16px; margin: 8px 0 0; font-size: 14px; line-height: 1.4; }
  .fetch p { margin: 0; color: var(--muted); }
  main { flex: 1; display: flex; min-height: 0; }
  section { padding: 16px 24px; overflow: auto; border-right: 1px solid var(--line); min-height: 0; }
  #left-column { width: 20rem; flex: none; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #left-column > section { border-right: 0; }
  #funnel-section { flex: 0 0 auto; max-height: 60%; overflow: auto; border-bottom: 1px solid var(--line); }
  #stats-section { flex: 1 1 auto; min-height: 0; overflow: auto; }
  #queue-section { width: 24rem; flex: none; overflow: auto; border-right: 1px solid var(--line); }
  #card-section { flex: 1; min-width: 0; overflow: auto; border-right: 0; }
  h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; line-height: 1.3; }
  h3 { margin: 24px 0 8px; font-size: 14px; font-weight: 600; line-height: 1.4; }
  p { margin: 0 0 8px; }
  .rows { margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.4; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  button.row { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 0; border-bottom: 1px solid var(--line); border-left: 2px solid transparent; padding: 8px 8px 8px 10px; cursor: pointer; text-align: left; }
  button.row:hover { background: var(--surface); }
  button.row[aria-pressed="true"] { border-left-color: var(--accent); background: var(--accent-tint); }
  button.row .k { color: var(--accent); }
  .note { margin: 0 0 8px; font-size: 12px; line-height: 1.33; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  button.queue-item {
    width: 100%; display: block; text-align: left; cursor: pointer; font: inherit;
    background: var(--bg); color: inherit; border: 0; border-bottom: 1px solid var(--line);
    border-left: 2px solid transparent; padding: 8px 8px 8px 10px;
  }
  button.queue-item:hover { background: var(--surface); }
  button.queue-item[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-tint); }
  .q-title { display: block; font-size: 16px; font-weight: 600; line-height: 1.5; }
  .q-status { display: block; margin-top: 4px; font-size: 14px; line-height: 1.4; }
  .q-stage, .q-action { display: block; margin-top: 4px; font-size: 14px; line-height: 1.4; }
  .q-stage { color: var(--muted); }
  .q-id { display: block; margin-top: 4px; font: 400 12px/1.33 var(--mono); color: var(--muted); }
  .queue-controls { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; line-height: 1.4; }
  .queue-controls label { color: var(--muted); }
  .queue-controls select { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); min-height: 32px; padding: 4px 8px; }
  .q-group-head { width: 100%; display: block; text-align: left; background: var(--surface); border: 0; border-left: 2px solid var(--accent); border-bottom: 1px solid var(--line); padding: 8px 8px 8px 10px; cursor: pointer; font: inherit; }
  .q-group-head:hover { background: var(--accent-tint); }
  .q-group-title { display: block; font-size: 14px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
  .q-group-meta { display: block; margin-top: 2px; font-size: 12px; line-height: 1.33; color: var(--muted); }
  .q-children { margin: 0; padding: 0; list-style: none; border-left: 2px solid var(--line); }
  .q-children button.queue-item { padding-left: 16px; }
  .q-tier { padding: 12px 0 4px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; line-height: 1.4; }
  .tag { display: inline-block; margin-right: 8px; padding: 2px 8px; border-radius: 24px; font-size: 12px; line-height: 1.33; }
  .tag.t-exceeds { background: var(--accent-tint); color: var(--accent); }
  .tag.t-near { background: var(--surface); color: var(--fg); }
  .tag.t-clear { background: var(--surface); color: var(--muted); }
  .m { font-weight: 600; }
  .card { max-width: 840px; }
  .card .card-title { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; }
  .card .card-sub { margin: 8px 0 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
  .card ol { margin: 0 0 8px; padding-left: 24px; }
  .card li { margin-bottom: 4px; }
  .prose p { margin: 0 0 8px; }
  .src { font-size: 12px; line-height: 1.6; color: var(--muted); }
  .undecided li, li.u-row { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; min-height: 40px; padding: 8px 16px; background: var(--accent); color: #fff; border: 0; cursor: pointer; }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { background: var(--surface); color: var(--muted); cursor: default; }
  .btn-sm { min-height: 32px; padding: 4px 12px; }
  details.calc { margin-top: 8px; border-top: 1px solid var(--line); }
  details.calc summary { cursor: pointer; padding: 8px 0; font-size: 14px; font-weight: 600; color: var(--accent); }
  details.calc summary .btn { margin-left: 8px; vertical-align: middle; }
  details.calc pre { margin: 0 0 8px; white-space: pre-wrap; font: 400 14px/1.45 var(--mono); color: var(--fg); }
  footer { padding: 16px 24px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.33; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media print {
    body { display: block; background: #fff; color: #000; }
    header, #queue-section { display: none; }
    main { display: block; }
    section { border: 0; padding: 0; overflow: visible; }
    #left-column { display: block; width: auto; border: 0; }
    #funnel-section { max-height: none; border: 0; }
    #stats-section { overflow: visible; }
    #card-section { width: auto; }
    .tag { background: #fff; border: 1px solid #000; color: #000; }
    a { color: #000; }
  }
</style>
<header>
  <h1>Kaista</h1>
  <p class="sub">Screening ITU frequency filings</p>
  <p class="funnel-line" id="funnel-line">loading...</p>
  <div class="fetch">
    <p id="fetch-status">No check has run yet.</p>
    <button class="btn btn-sm" id="fetch-check" type="button">Check now</button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</header>
<main>
  <div id="left-column">
    <section id="funnel-section" aria-labelledby="h-funnel">
      <h2 id="h-funnel">Funnel</h2>
      <div id="funnel"></div>
    </section>
    <section id="stats-section" aria-labelledby="h-stats">
      <h2 id="h-stats">Complaint register</h2>
      <p class="note" id="stats-banner">loading...</p>
      <div class="queue-controls">
        <label for="stats-year">Year</label>
        <select id="stats-year">
          <option value="">All years</option>
        </select>
        <a class="btn btn-sm" id="stats-csv" href="/api/stats.csv">Download CSV</a>
      </div>
      <div id="stats"></div>
    </section>
  </div>
  <section id="queue-section" aria-labelledby="h-queue">
    <h2 id="h-queue">Queue</h2>
    <p class="note" id="queue-filter"></p>
    <div class="queue-controls">
      <label for="group-by">Group by</label>
      <select id="group-by">
        <option value="network">Network</option>
        <option value="admin">Administration</option>
        <option value="band">Band</option>
        <option value="stage">Stage</option>
        <option value="victim">Victim station</option>
        <option value="none">None</option>
      </select>
    </div>
    <ul id="queue"></ul>
  </section>
  <section id="card-section" aria-labelledby="h-card">
    <h2 id="h-card">Card</h2>
    <div id="card">Select a card from the queue.</div>
  </section>
</main>
<footer>The tool does not decide. Every number comes from code, not from a language model.</footer>
<script>
"use strict";

// All data lands through textContent: nothing from out/ is interpolated into HTML.
function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

// English number formatting; values stay exactly as the files carry them.
function num(value, unit) {
  if (value === null || value === undefined || value === "") return "unknown";
  const n = Number(value);
  if (!isFinite(n)) return String(value);
  return n.toLocaleString("en-GB", { maximumFractionDigits: 6 }) + (unit ? " " + unit : "");
}

function signed(value, unit) {
  const n = Number(value);
  if (!isFinite(n)) return num(value, unit);
  return (n >= 0 ? "+" : "") + num(n, unit);
}

function hzText(value) {
  const n = Number(value);
  if (!isFinite(n)) return "unknown";
  if (n >= 1e6) return num(n / 1e6, "MHz");
  if (n >= 1e3) return num(n / 1e3, "kHz");
  return num(n, "Hz");
}

function rows(pairs) {
  const box = el("div", null, "rows");
  for (const [label, value] of pairs) {
    if (value === undefined || value === null || value === "") continue;
    const row = el("div", null, "row");
    row.append(el("span", label, "k"), el("span", value, "v"));
    box.append(row);
  }
  return box;
}

// UI-only English words. The data keeps its own labels (cases.json is untouched).
const ADMIN_EN = { CHN: "China", USA: "United States", RUS: "Russia", EST: "Estonia" };
const CLASS_EN = {
  exceeds: "Exceeds limit", near: "Near limit",
  clear: "Clear", cannot_decide: "Cannot decide", not_space: "No satellite use in Finland",
};
// notice.act_code: what the filing does to the record.
const ACTION_EN = { A: "New filing", M: "Modification", S: "Suppression" };
// ntc_lnk.lnkntf_rsn: the nature of the notice a filing follows.
const NTF_REASON_EN = {
  N: "notification, No. 11.2",
  C: "coordination request, No. 9.6",
  A: "advance publication, No. 9.1",
  U: "Resolution 49 filing",
};
const STAGE_EN = {
  "No. 9.1": { name: "Advance publication", short: "API", meaning: "Can still be influenced." },
  "No. 9.6": { name: "Coordination request", short: "CRC", meaning: "Can still be influenced." },
  "No. 11.2": { name: "Recorded in the MIFR", short: "MIFR", meaning: "No longer influenceable." },
  "Resolution 49": { name: "Resolution 49 notice", short: "Res. 49", meaning: "" },
};
const UNDECIDED_EN = {
  no_power: "no transmitted power",
  no_gain: "no beam gain",
  no_orbit: "no orbit data",
  no_perigee: "no perigee",
  no_limit_for_band: "no limit for the band",
  no_station: "no Finnish station",
  no_territory: "no point on Finnish territory",
};
const DROP_LABEL = {
  no_band_overlap: "No band overlap",
  earth_station_notice: "Earth station notice",
  geo_below_horizon: "Below the horizon",
  ngso_never_visible: "Never visible from Finland",
};

function adminName(code) {
  return ADMIN_EN[code] || code || "unknown administration";
}

function stageOf(item) {
  const prov = item.regulatory_stage && item.regulatory_stage.provision;
  return STAGE_EN[prov] || { name: prov || "unknown stage", meaning: "" };
}

// "No. 9.1 Advance publication (API). Can still be influenced."
function filingStage(item) {
  const prov = (item.regulatory_stage && item.regulatory_stage.provision) || "unknown stage";
  const stage = STAGE_EN[prov] || {};
  const name = stage.name && !prov.toUpperCase().includes(stage.name.toUpperCase())
    ? prov + " " + stage.name : (stage.name || prov);
  const short = stage.short && !name.toUpperCase().includes(stage.short.toUpperCase())
    ? " (" + stage.short + ")" : "";
  return [name + short, stage.meaning].filter(Boolean).join(". ");
}

function bandText(band) {
  if (!band || band.freq_min_mhz === undefined) return "band unknown";
  return num(band.freq_min_mhz) + "\u2013" + num(band.freq_max_mhz) + " MHz";
}

function fmtRun(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso || "unknown";
  return d.toLocaleString("en-GB", {
    day: "numeric", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: false,
  });
}

function missingText(item) {
  // Beam geometry is not missing information: the screening assumes the worst case (Traficom Q&A Q3).
  const missing = (item.missing || []).filter((field) => !String(field).startsWith("s_beam."));
  if (!missing.length) return "No missing information.";
  return "The notice is missing " + missing.join(", ") + ".";
}

// The floor when the pipeline wrote no prose: same sentences the card would carry anyway.
function deterministicProse(item) {
  const coverage = item.coverage || {};
  const over = Number(item.calculation && item.calculation.margin_db) >= 0;
  return "Satellite " + (coverage.sat_name || item.case_id) + " (" +
    adminName(item.parties && item.parties.admin) + ") declares it transmits on " +
    bandText(item.band) + " towards Finland. The calculated upper bound is " +
    signed(item.calculation && item.calculation.margin_db, "dB") +
    (over ? " above the ITU limit" : " below the ITU limit") +
    ". This is not interference and not a decision, but a reason to look at the case more closely.";
}

// prose.text is Markdown; drop the "# ..." heading lines and keep the paragraphs.
function proseParagraphs(text) {
  const kept = String(text).split("\n").filter((line) => !line.trim().startsWith("#")).join("\n");
  return kept.split(/\n{2,}/).map((block) => block.trim()).filter(Boolean);
}

function calculationText(item) {
  const c = item.calculation || {};
  const coverage = item.coverage || {};
  const s = item.source || {};
  const keys = s.keys || {};
  return [
    "Transmit PSD " + num(c.psd_dbw_hz, "dBW/Hz") + " + beam gain " +
      num(c.beam_gain_db, "dBi") + " - free-space loss " + num(c.fspl_db, "dB"),
    "= PFD " + num(c.pfd_dbw_m2_hz, "dB(W/m\u00b2/Hz)"),
    "Limit " + num(c.limit_dbw_m2_hz, "dB(W/m\u00b2/Hz)") + ", margin " + signed(c.margin_db, "dB"),
    "Distance " + num(c.distance_km, "km") + ", elevation " + num(coverage.elevation_deg, "\u00b0"),
    "Formula: PFD = PSD + beam gain - free-space loss; limit = Table 21-4 value at " +
      "elevation - 10 log10(reference bandwidth).",
    "Limit source: " + (c.limit_source || "unknown"),
    "Limit row: A " + num(c.limit_a_db, "dB(W/m\u00b2)") + " at 0-5\u00b0, K " +
      num(c.limit_k_db, "dB") + ", reference bandwidth " + hzText(c.limit_ref_hz) +
      " (" + (c.limit_page || "page unknown") + ").",
    "Criterion: " + (c.criterion || "Table 21-4"),
    "Input: notice " + (keys.ntc_id || "unknown") + ", group " + (keys.grp_id || "unknown") +
      ", beam " + (keys.beam_name || "unknown") + ", file " + (s.file || "unknown") +
      ", tables " + ((s.tables || []).join(", ") || "unknown") + ".",
  ].join("\n");
}

function sourceLine(item) {
  const s = item.source || {};
  const a = item.audit || {};
  const sha = s.sha256 || a.input_sha256 || "";
  const shortSha = sha ? sha.slice(0, 12) + "\u2026" + sha.slice(-4) : "unknown";
  return "Notice " + ((s.keys && s.keys.ntc_id) || "unknown") + " \u00b7 file " +
    (s.file || "unknown") + " \u00b7 SHA256 " + shortSha + " \u00b7 rules " +
    (a.rules_version || "unknown") + " \u00b7 run " + fmtRun(a.run_at);
}

function setStatus(message) {
  document.getElementById("status").textContent = message || "";
}

// The monitor's last answer (out/fetch_status.json): no_new, new or error.
function renderFetch(status) {
  const line = document.getElementById("fetch-status");
  if (!status || !status.status || status.status === "unknown") {
    line.textContent = "No check has run yet.";
    return;
  }
  const when = status.run_at || status.checked_at || "";
  const doc = status.document ? status.document + " " : "";
  if (status.status === "new") {
    const n = status.counts && status.counts.notices;
    line.textContent = "New " + doc + "IFIC " + status.ific + " fetched and processed " + fmtRun(when) +
      (n === undefined ? "" : " · " + n + " notices") + ".";
  } else if (status.status === "error") {
    line.textContent = "Check failed " + fmtRun(when) + ": " + (status.message || "") +
      (status.last_ific ? " The last good run is " + doc + "IFIC " + status.last_ific + "." : "");
  } else {
    line.textContent = "No new " + doc + "IFIC has been published yet (latest " + status.last_ific +
      "). Checked " + fmtRun(when) +
      (status.next_check ? " · next check " + fmtRun(status.next_check) : "") + ".";
  }
}

async function loadFetch() {
  try {
    const status = await get("/api/fetch-status");
    renderFetch(status);
    if (status.check_locked) {
      const button = document.getElementById("fetch-check");
      button.disabled = true;
      button.title = "Switched off on this demo";
    }
  } catch (error) {
    renderFetch(null);
  }
}

async function checkNow() {
  const button = document.getElementById("fetch-check");
  button.disabled = true;
  button.textContent = "Checking...";
  setStatus("Checking ITU for a new IFIC package...");
  try {
    const response = await fetch("/api/fetch-check", { method: "POST" });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail || "HTTP " + response.status);
    renderFetch(body);
    if (body.status === "new") {
      setStatus("New IFIC " + body.ific + " processed. Refreshing the view...");
      location.reload();
      return;
    }
    setStatus(body.status === "error" ? "Check failed: " + (body.message || "") : "");
  } catch (error) {
    setStatus("Check did not succeed: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Check now";
  }
}

function copyText(text, button, what = "Question") {
  if (!text) return;
  const label = button.dataset.label || button.textContent;
  button.dataset.label = label;
  const done = () => {
    button.textContent = "Copied";
    setStatus(what + " copied to the clipboard.");
    setTimeout(() => { button.textContent = label; }, 1600);
  };
  const fail = () => setStatus("Copy failed. Select the " + what.toLowerCase() + " manually.");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fail);
  } else {
    fail();
  }
}

async function get(url) {
  const response = await fetch(url);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || "HTTP " + response.status);
  return body;
}

function undecidedText(row) {
  const detail = (funnelData.undecided_detail || {})[row.ntc_id] || {};
  const parts = [UNDECIDED_EN[detail.reason] || detail.reason || row.reason_text || "unknown reason"];
  if (detail.required_db !== undefined && detail.required_db !== null) {
    const field = detail.field === "psd" ? "transmit PSD" : detail.field === "gain" ? "beam gain" : detail.field;
    const unit = detail.field === "gain" ? "dBi" : "dBW/Hz";
    parts.push("the " + field + " would need at least " + num(detail.required_db, unit) +
      " to reach the limit");
  }
  return parts.join(" \u00b7 ");
}

// Every funnel row is a filter button. A second click on the same row clears the filter.
function filterRows(pairs) {
  const box = el("div", null, "rows");
  for (const [label, value, key] of pairs) {
    const button = el("button", null, "row");
    button.type = "button";
    button.dataset.filter = key;
    button.setAttribute("aria-pressed", String(queueFilter === key));
    button.append(el("span", label, "k"), el("span", num(value), "v"));
    button.addEventListener("click", () => setFilter(queueFilter === key ? null : key));
    box.append(button);
  }
  return box;
}

// A row's meaning in the queue: a class narrows, the stage rows show what passed, a drop row none.
function filterLabel(key) {
  if (key === "notices") return "all notices";
  if (key === "g1") return "Band overlap";
  if (key === "g2") return "Visible from Finland";
  if (key === "g3") return "Computed";
  if (CLASS_EN[key]) return CLASS_EN[key];
  if (key.indexOf("drop:") === 0) return DROP_LABEL[key.slice(5)] || key.slice(5);
  return "all notices";
}

function setFilter(key) {
  queueFilter = key;
  for (const button of document.querySelectorAll("button.row[data-filter]")) {
    button.setAttribute("aria-pressed", String(button.dataset.filter === key));
  }
  renderQueue(queueItems);
  setStatus("");
}

function renderFunnel(data) {
  funnelData = data;
  const c = data.counts;
  const q = data.queue || {};
  document.getElementById("funnel-line").textContent =
    c.notices + " \u2192 " + c.g1 + " \u2192 " + c.g2 + " \u2192 " + c.g3 + " + " +
    c.cannot_decide + " \u00b7 every notice in the queue: " + (q.attention || 0) +
    " need attention, " + (q.checked || 0) + " checked, " + (q.no_effect || 0) +
    " without effect on Finland";
  document.getElementById("funnel").replaceChildren(
    filterRows([
      ["Notices", c.notices, "notices"],
      ["Band overlap", c.g1, "g1"],
      ["Visible from Finland", c.g2, "g2"],
      ["Computed", c.g3, "g3"],
    ]),
    filterRows([
      ["Exceeds limit", c.exceeds, "exceeds"],
      ["Near limit", c.near, "near"],
      ["No satellite use in Finland", c.not_space, "not_space"],
      ["Clear", c.clear, "clear"],
      ["Cannot decide", c.cannot_decide, "cannot_decide"],
    ]),
    el("h3", "Drops"),
    filterRows(Object.entries(data.drops).map(([key, value]) => [DROP_LABEL[key] || key, value, "drop:" + key])),
    el("h3", "Run"),
    rows([
      ["Mode", data.mode],
      ["Rules", data.rules_version],
      ["Time", fmtRun(data.run_at)],
      ["Input SHA256", data.input_sha256],
    ]),
  );
}

// The queue order mirrors app/gates.py::queue_key: regulatory stage, then class, then the
// earliest upcoming Resolution 35 deadline. The margin does not order (Traficom, S1).
const QUEUE_CLASS = ["exceeds", "near", "not_space", "cannot_decide", "clear"];
const QUEUE_STAGE = { "No. 9.1": 0, "No. 9.6": 0, "No. 11.2": 1, "Resolution 49": 2 };
const QUEUE_STAGE_UNKNOWN = 9;

function queueKey(item) {
  const klass = QUEUE_CLASS.indexOf(item["class"]);
  const stage = item.regulatory_stage && item.regulatory_stage.provision;
  let deadlineRank = 2;
  let ordinal = 0;
  if (item.deadline) {
    const [day, month, year] = item.deadline.split(".").map(Number);
    const stamp = Date.UTC(year, month - 1, day);
    if (item.deadline_passed) { deadlineRank = 1; ordinal = -stamp; }
    else { deadlineRank = 0; ordinal = stamp; }
  }
  return [
    QUEUE_STAGE[stage] === undefined ? QUEUE_STAGE_UNKNOWN : QUEUE_STAGE[stage],
    klass < 0 ? QUEUE_CLASS.length : klass,
    deadlineRank,
    ordinal,
    item.ntc_id || item.case_id,
  ];
}

function compareQueue(a, b) {
  const ka = queueKey(a);
  const kb = queueKey(b);
  for (let i = 0; i < ka.length; i += 1) {
    if (ka[i] < kb[i]) return -1;
    if (ka[i] > kb[i]) return 1;
  }
  return 0;
}

function queueRow(item) {

  button.type = "button";
  button.dataset.caseId = item.case_id;

    "span",

  ));

  status.append(

    el("span", signed(item.calculation && item.calculation.margin_db, "dB"), "m"),
  );
  button.append(status);

  button.append(el("span", [stage.name, stage.meaning].filter(Boolean).join(". "), "q-stage"));
  const publication = item.publication || {};

// A notice without a card keeps a queue row: a dropped notice or one that cannot be decided.
function noticeRow(row) {

    [row.sat_name || row.ntc_id, adminName(row.adm), row.ntc_id].filter(Boolean).join(" \u00b7 "),
    "q-title"));

    : (row.reason_text || row.reason || "");

function groupKeyOf(item, by) {
  if (by === "admin") return (item.parties && item.parties.admin) || "";
  if (by === "band") return [item.band && item.band.freq_min_mhz, item.band && item.band.freq_max_mhz].join("-");
  if (by === "stage") return (item.regulatory_stage && item.regulatory_stage.provision) || "";
  if (by === "victim") return (item.victim && item.victim.station) || "";
  return "";
}

function groupTitle(items, by) {
  const first = items[0];
  const unique = (values) => [...new Set(values.filter(Boolean))];
  if (by === "network") {
    const sats = unique(items.map((item) => item.coverage && item.coverage.sat_name));
    const admins = unique(items.map((item) => adminName(item.parties && item.parties.admin)));
    return [sats.join(" + ") || first.case_id, admins.join(", ")].filter(Boolean).join(" \u00b7 ");
  }
  if (by === "admin") return unique(items.map((item) => adminName(item.parties && item.parties.admin))).join(", ") || "Unknown administration";
  if (by === "band") return unique(items.map((item) => bandText(item.band))).join(" / ");
  if (by === "stage") {
    const stage = stageOf(first);
    return [stage.name, stage.meaning].filter(Boolean).join(". ");
  }
  if (by === "victim") {
    const victim = first.victim || {};
    return victim.station ? "Station " + victim.station + (victim.class ? " (" + victim.class + ")" : "") : "No victim station";
  }
  return "All cases";
}

function groupQueue(queue, by) {
  if (by === "network") {
    const parent = new Map(queue.map((item) => [item.case_id, item.case_id]));
    const find = (id) => {
      let root = id;
      while (parent.get(root) !== root) root = parent.get(root);
      while (parent.get(id) !== id) {
        const next = parent.get(id);
        parent.set(id, root);
        id = next;
      }
      return root;
    };
    const union = (a, b) => {
      const rootA = find(a);
      const rootB = find(b);
      if (rootA !== rootB) parent.set(rootB, rootA);
    };
    for (const item of queue) {
      const prefix = item.case_id.slice(0, item.case_id.lastIndexOf("-") + 1);
      for (const sibling of item.same_network || []) {
        const other = queue.find((row) => row.case_id === prefix + sibling);
        if (other) union(item.case_id, other.case_id);
      }
    }
    const groups = new Map();
    for (const item of queue) {
      const root = find(item.case_id);
      if (!groups.has(root)) groups.set(root, []);
      groups.get(root).push(item);
    }
    return [...groups.values()].map((items) => items.sort(compareQueue));
  }
  const groups = new Map();
  for (const item of queue) {
    const key = groupKeyOf(item, by);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  }
  return [...groups.values()].map((items) => items.sort(compareQueue));
}

function groupRow(items, by) {
  const li = el("li");
  const head = el("button", null, "q-group-head");
  head.type = "button";
  head.setAttribute("aria-expanded", "true");
  head.append(el("span", groupTitle(items, by), "q-group-title"));

  const meta = el("span", null, "q-group-meta");
  const worst = items[0];
  meta.append(el("span", CLASS_EN[worst["class"]] || worst["class"], "tag t-" + worst["class"]));
  meta.append(document.createTextNode(
    items.length + (items.length === 1 ? " case" : " cases") + " \u00b7 " +
    signed(worst.calculation && worst.calculation.margin_db, "dB"),
  ));
  const deadline = items.find((item) => item.deadline);
  if (deadline) meta.append(document.createTextNode(" \u00b7 DL " + deadline.deadline));
  head.append(meta);

  const children = el("ul", null, "q-children");
  for (const item of items) children.append(queueRow(item));
  head.addEventListener("click", () => {
    const open = children.hidden;
    children.hidden = !open;
    head.setAttribute("aria-expanded", String(open));
  });
  li.append(head, children);
  return li;
}

let queueItems = [];
let fullQueue = [];
let queueGroup = "network";
let queueFilter = null;
let funnelData = {};
let currentCaseId = null;

function matchesFilter(row) {
  const key = queueFilter;
  if (!key || key === "notices") return true;
  if (key.indexOf("drop:") === 0) return Boolean(row.dropped_at) && row.reason === key.slice(5);
  if (key === "g1") return row.dropped_at !== "G1";  // passed band overlap
  if (key === "g2") return !row.dropped_at;          // passed horizon
  if (key === "g3") return Boolean(row.case_id);     // computed into a card
  return row["class"] === key;
}

function renderQueue(items) {
  queueItems = items;
  const ul = document.getElementById("queue");
  const label = document.getElementById("queue-filter");
  label.replaceChildren();
  if (queueFilter) {
    const all = el("button", "Show all", "btn btn-sm");
    all.type = "button";
    all.addEventListener("click", () => setFilter(null));
    label.append(document.createTextNode("Showing: " + filterLabel(queueFilter) + " "), all);
  }
  const cardsById = new Map(items.map((item) => [item.case_id, item]));
  const visible = fullQueue.filter(matchesFilter);
  if (!visible.length) {
    ul.replaceChildren(el("li", queueFilter ? "No notices for this filter." : "The queue is empty."));
    return;
  }
  const tiers = [
    ["attention", "Needs attention"],
    ["checked", "Checked, nothing to note"],
    ["no_effect", "No effect on Finland"],
  ];
  const showEmpty = !queueFilter || queueFilter === "notices";
  const out = [];
  for (const [tier, title] of tiers) {
    const rows = visible.filter((row) => row.tier === tier);
    if (!rows.length && !showEmpty) continue;
    out.push(el("li", title + " (" + rows.length + ")", "q-tier"));
    if (tier === "no_effect") {
      out.push(...rows.map(noticeRow));
      continue;
    }
    const cards = rows.map((row) => cardsById.get(row.case_id)).filter(Boolean);
    const withoutCard = rows.filter((row) => !cardsById.has(row.case_id));
    if (cards.length) {
      if (queueGroup === "none") {
        out.push(...cards.map(queueRow));
      } else {
        const groups = groupQueue(cards, queueGroup).sort((a, b) => compareQueue(a[0], b[0]));
        out.push(...groups.map((group) => group.length === 1 ? queueRow(group[0]) : groupRow(group, queueGroup)));
      }
    }
    out.push(...withoutCard.map(noticeRow));
  }
  ul.replaceChildren(...out);
  if (currentCaseId) markCurrent(currentCaseId);
}

function markCurrent(caseId) {
  for (const button of document.querySelectorAll("button.queue-item")) {
    button.setAttribute("aria-current", String(button.dataset.caseId === caseId));
  }
}

// The register's closed lists, in the words the view uses. The data keeps its own codes.
const ISSUE_EN = {
  pfd_exceedance: "PFD over the limit",
  near_limit: "Near the limit",
  band_without_satellite_allocation: "Band without satellite use in Finland",
  missing_data: "Cannot decide (missing data)",
  terrestrial_field_strength: "Terrestrial field strength",
};
const DONE_EN = {
  comment_sent: "Comment sent",
  coordination_requested: "Coordination requested",
  br_assistance_requested: "BR assistance requested",
  no_action_decided: "No action decided",
};

function outcomeText(outcomes) {
  return Object.entries(outcomes || {})
    .map(([key, value]) => key.replace(/_/g, " ") + ": " + value)
    .join(" \u00b7 ");
}

function statsBlock(title, items, label) {
  const box = el("div");
  box.append(el("h3", title, "card-title"));
  if (!items || !items.length) {
    box.append(el("p", "Nothing recorded.", "note"));
    return box;
  }
  const list = el("div", null, "rows");
  // The view shows the biggest rows; the CSV carries every one of them.
  const shown = items.slice(0, 8);
  for (const row of shown) {
    const line = el("div", null, "row");
    line.append(el("span", label(row), "k"));
    line.append(el("span", [
      num(row.count),
      row.open ? row.open + " open" : "",
      row.median_days === null || row.median_days === undefined ? "" : "median " + row.median_days + " d",
    ].filter(Boolean).join(" \u00b7 "), "v"));
    list.append(line);
    if (outcomeText(row.outcomes)) list.append(el("div", outcomeText(row.outcomes), "note"));
  }
  box.append(list);
  if (items.length > shown.length) {
    box.append(el("p", (items.length - shown.length) + " more in the CSV.", "note"));
  }
  return box;
}

function renderStats(summary) {
  const t = summary.totals || {};
  document.getElementById("stats-banner").textContent = [
    num(t.complaints) + " complaints",
    t.open + " still open",
    t.median_days === null ? "" : "median " + t.median_days + " days from letter to reply",
    num(t.synthetic) + " of them are seeded demo history (2021-2026); the rest come from the pipeline runs",
  ].filter(Boolean).join(" \u00b7 ") + ".";

  const box = document.getElementById("stats");
  box.replaceChildren();
  box.append(statsBlock("Who it was about", summary.admins, (row) => adminName(row.key)));
  box.append(statsBlock("Which network", summary.networks, (row) => row.key));
  box.append(statsBlock("Which band", summary.bands, (row) => row.key));
  box.append(statsBlock("What the issue was", summary.issues, (row) => ISSUE_EN[row.key] || row.key));
  box.append(statsBlock("What was done", summary.actions, (row) => DONE_EN[row.key] || row.key));
  const trend = (summary.trend || []).map((row) => row.year + ": " + row.total).join(" \u00b7 ");
  if (trend) box.append(el("p", "Per year " + trend, "note"));

}

async function loadStats() {
  const year = document.getElementById("stats-year").value;
  const query = year ? "?year=" + encodeURIComponent(year) : "";

// The card's own history: the earlier complaints for this administration and network,
// with the reply note the register holds. The aggregate stays in the register section.
function cardComplaints(item) {
  const box = el("div");
  const line = el("p", "Earlier complaints: loading...", "note");
  box.append(line);
  const adm = (item.parties && item.parties.admin) || "";
  const network = (item.coverage && item.coverage.sat_name) || "";
  const queries = [];
  if (adm) queries.push(get("/api/complaints?adm=" + encodeURIComponent(adm)));
  if (network) queries.push(get("/api/complaints?sat_name=" + encodeURIComponent(network)));
  Promise.all(queries).then((groups) => {
    const seen = new Set();
    const rows = [];
    for (const group of groups) {
      for (const row of group) {
        if (seen.has(row.complaint_id)) continue;
        seen.add(row.complaint_id);
        rows.push(row);
      }
    }
    rows.sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
    if (!rows.length) {
      line.textContent = "No earlier complaints in the register for this administration or network.";
      return;
    }
    const open = rows.filter((row) => row.status === "open").length;
    line.textContent = "Earlier complaints: " + rows.length + " (" + open + " open).";
    const list = el("ul", null, "undecided");
    for (const row of rows.slice(0, 5)) {
      const reply = (row.events || []).filter((event) => event.type === "reply_received").pop();
      const note = reply && reply.payload && reply.payload.note ? " \u2014 " + reply.payload.note : "";
      const outcome = row.outcome && row.outcome !== "pending"
        ? " \u00b7 " + row.outcome.replace(/_/g, " ") : "";
      const days = row.days_to_reply !== null && row.days_to_reply !== undefined
        ? " \u00b7 " + row.days_to_reply + " d" : "";
      const synthetic = row.synthetic ? " \u00b7 synthetic" : "";
      const issue = ISSUE_EN[row.issue_type] || row.issue_type || "issue";
      const who = row.sat_name || row.case_id || "case";
      list.append(el("li", row.at.slice(0, 10) + " \u00b7 " + who + " \u00b7 " + issue +
        " \u00b7 " + row.status + outcome + days + synthetic + note));
    }
    if (rows.length > 5) list.append(el("li", (rows.length - 5) + " more in the register."));
    box.append(list);
  }).catch(() => {
    line.textContent = "Could not load the complaint register.";
  });
  return box;
}

function renderCard(item) {
  const c = item.calculation || {};
  const coverage = item.coverage || {};
  const point = item.point || {};
  const klass = item["class"];
  const verb = klass === "exceeds" ? "exceeds the limit"
    : klass === "near" ? "is near the limit"
    : klass === "not_space" ? "is on a band Finland has not allocated to satellite downlink"
    : "is clearly below the limit";
  const card = el("article", null, "card");

  card.append(el(
    "h3",
    (coverage.sat_name || item.case_id) + ", " + adminName(item.parties && item.parties.admin) +
      ": " + verb + " " + signed(c.margin_db, "dB"),
    "card-title",
  ));
  card.append(el("p", [
    bandText(item.band),
    coverage.orbit,
    coverage.beam ? "beam " + coverage.beam : "",
  ].filter(Boolean).join(" \u00b7 "), "card-sub"));
  card.append(el("p", "Filing stage: " + filingStage(item), "note"));
  const publication = item.publication || {};
  const pubRefs = (publication.refs || []).join(", ");
  const pubSessions = (publication.sessions || []).map((entry) =>
    entry.ref + " " + entry.session +
    (entry.revision ? " " + entry.revision + (entry.revision_no || "") : "")
  ).join("; ");
  card.append(el("p", "Publication: " + (publication.label || "unknown") +
    (pubRefs ? " (" + pubRefs + ")" : "") +
    (pubSessions ? ". BR IFIC " + pubSessions + "." : ""), "note"));
  const action = ACTION_EN[item.filing_action];
  if (action) card.append(el("p", "Filing action: " + action + ".", "note"));
  for (const link of item.filing_follows || []) {
    const reason = NTF_REASON_EN[link.reason] || link.reason;
    card.append(el("p", "This filing follows " + link.ntc_id + " (" + reason + ").", "note"));
  }
  card.append(cardComplaints(item));
  const at = point.lat !== undefined && point.lat !== null
    ? point.lat + " N, " + point.lon + " E (" + (point.place || "") + ")"
    : (point.place || "Finnish territory");
  card.append(el("p", "Worst case at " + at + ", elevation " +
    num(coverage.elevation_deg, "\u00b0") + ".", "note"));
  const victim = item.victim || {};
  if (victim.station) {
    const where = victim.lat !== undefined && victim.lat !== null && victim.lon !== undefined && victim.lon !== null
      ? " at " + victim.lat + " N, " + victim.lon + " E" : "";
    card.append(el("p", "Reference row: station " + victim.station +
      (victim.class ? " (" + victim.class + ")" : "") + where +
      (victim.gain_db !== undefined && victim.gain_db !== null ? ", " + victim.gain_db + " dBi" : "") +
      " \u2014 the register is a reference, not the whole use.", "note"));
  }

  card.append(el("h3", "What this means"));
  const prose = item.prose || {};
  if (prose.text) {
    const box = el("div", null, "prose");
    for (const paragraph of proseParagraphs(prose.text)) box.append(el("p", paragraph));
    card.append(box, el("p", "Narrative: " + (prose.source === "llm" ? "language model" : "template") +
      " (" + (prose.source || "template") + ")", "src"));
  } else {
    card.append(el("p", deterministicProse(item)), el("p", "Narrative: template (deterministic)", "src"));
  }

  card.append(el("h3", "What you need to decide"));
  const questions = el("ol");
  questions.append(el("li", "Confirm the worst case is assumed: the beam's peak gain points at " +
    "a point in Finland, as Traficom advised (beam direction is not needed)."));
  questions.append(el("li", "Does the band match the use listed in Finland's M4 table?"));
  questions.append(el("li", (item.next_action && item.next_action.question) || "No question."));
  card.append(questions);

  card.append(el("h3", "What information is missing"), el("p", missingText(item)));

  card.append(el("h3", "What is on the band in Finland"));
  card.append(el("p", (item.m4 && item.m4.services_in_finland) || "no information"));
  if (item.m4 && item.m4.satellite_use === false) {
    const gaps = (item.m4.gaps || []).map(([lo, hi]) => num(lo) + "-" + num(hi) + " MHz").join(", ");
    card.append(el("p", "No satellite service on " + (gaps || "part of the band") +
      ": a satellite transmitting there is a finding on its own, whatever the PFD says.", "note"));
  }
  if (item.m4 && item.m4.source) card.append(el("p", "M4: " + item.m4.source, "src"));

  card.append(el("h3", "Question to the other administration"));
  const question = (item.next_action && item.next_action.question) || "";
  card.append(el("p", question || "No question."));
  const copy = el("button", "Copy question", "btn");
  copy.type = "button";
  copy.addEventListener("click", () => copyText(question, copy));
  card.append(copy);

  const details = el("details", null, "calc");
  details.append(el("summary", "Show calculation"), el("pre", calculationText(item)));
  card.append(details);

  // The card exactly as cases.json holds it: every value behind the rendering above.
  // The raw JSON is also the thing a specialist pastes into their own tools.
  const rawText = JSON.stringify(item, null, 2);
  const raw = el("details", null, "calc");
  const rawSummary = el("summary");
  rawSummary.append("Show raw data (JSON)");
  const copyRaw = el("button", "Copy data", "btn btn-sm");
  copyRaw.type = "button";
  copyRaw.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    copyText(rawText, copyRaw, "Raw JSON");
  });
  rawSummary.append(" ", copyRaw);
  raw.append(rawSummary, el("pre", rawText));
  card.append(raw);

  card.append(el("p", sourceLine(item), "src"));
  document.getElementById("card").replaceChildren(card);
}

async function showCase(caseId) {
  currentCaseId = caseId;
  markCurrent(caseId);
  setStatus("Loading card " + caseId + "...");
  try {
    renderCard(await get("/api/cases/" + encodeURIComponent(caseId)));
    setStatus("");
  } catch (error) {
    setStatus("Could not load the card: " + error.message);
  }
}

async function start() {
  loadFetch();
  loadStats();
  try {
    const [funnel, cards, full] = await Promise.all([
      get("/api/funnel"), get("/api/queue"), get("/api/queue/full"),
    ]);
    renderFunnel(funnel);
    queueItems = cards;
    fullQueue = full;
    renderQueue(queueItems);
    setStatus("");
  } catch (error) {
    setStatus("Could not load the data: " + error.message);
    document.getElementById("funnel-line").textContent = "no data";
  }
}

document.getElementById("fetch-check").addEventListener("click", checkNow);
document.getElementById("stats-year").addEventListener("change", loadStats);
document.getElementById("group-by").addEventListener("change", (event) => {
  queueGroup = event.target.value;
  renderQueue(queueItems);
  setStatus("");
});
start();
</script>
</html>
