<!doctype html>
<html lang="fi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaista - IFIC-triage</title>
<style>
  :root {
    --bg: #10161d; --panel: #18212b; --line: #2b3a49;
    --fg: #edf3f8; --muted: #9db0c2; --accent: #7fd1a8;
    --exceeds: #ff8a7a; --near: #ffcf70; --cannot: #9db0c2; --clear: #7fd1a8;
  }
  * { box-sizing: border-box; }
  html { font-size: 19px; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: .6rem 1rem; border-bottom: 2px solid var(--line); }
  header h1 { margin: 0; font-size: 1.5rem; letter-spacing: .02em; }
  .funnel-line { margin: .2rem 0 0; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .status { margin: .2rem 0 0; min-height: 1.2rem; color: var(--near); font-size: .95rem; }
  main { flex: 1; display: grid; grid-template-columns: 19rem 21rem 1fr; min-height: 0; }
  section { padding: .7rem 1rem; overflow: auto; border-right: 1px solid var(--line); min-height: 0; }
  section:last-child { border-right: 0; }
  h2 { margin: 0 0 .5rem; font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .15rem .6rem; margin: 0; }
  dt { color: var(--muted); font-size: .85rem; }
  dd { margin: 0; font-size: .95rem; overflow-wrap: anywhere; }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: .35rem; }
  button.queue-item {
    width: 100%; text-align: left; cursor: pointer; font: inherit;
    background: var(--panel); color: inherit; border: 1px solid var(--line);
    border-radius: .35rem; padding: .4rem .6rem; display: grid;
    grid-template-columns: 1fr auto; gap: 0 .6rem;
  }
  button.queue-item > :first-child { grid-column: 1 / -1; white-space: nowrap; }
  button.queue-item[aria-current="true"] { border-color: var(--accent); }
  .klass { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
  .exceeds { color: var(--exceeds); } .near { color: var(--near); }
  .cannot_decide { color: var(--cannot); } .clear { color: var(--clear); }
  .margin { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
  h3 { margin: 1rem 0 .3rem; font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  pre { white-space: pre-wrap; font-size: .85rem; line-height: 1.45; margin: 0; }
  .note { margin: .8rem 0 0; color: var(--muted); font-size: .8rem; }
</style>
<header>
  <h1>Kaista</h1>
  <p class="funnel-line" id="funnel-line">ladataan...</p>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</header>
<main>
  <section aria-labelledby="h-funnel">
    <h2 id="h-funnel">Suppilo</h2>
    <div id="funnel"></div>
  </section>
  <section aria-labelledby="h-queue">
    <h2 id="h-queue">Jono</h2>
    <p class="note">Ei päätettävissä olevat ilmoitukset eivät tuota korttia, joten ne näkyvät vain suppilossa.</p>
    <ul id="queue"></ul>
  </section>
  <section aria-labelledby="h-card">
    <h2 id="h-card">Kortti</h2>
    <div id="card">Valitse kortti jonosta.</div>
  </section>
</main>
<script>
"use strict";

// All data lands through textContent: nothing from out/ is interpolated into HTML.
function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

function num(value, unit) {
  if (value === null || value === undefined || value === "") return "ei tiedossa";
  return String(value).replace(".", ",") + (unit ? " " + unit : "");
}

function list(rows) {
  const dl = el("dl");
  for (const [label, value] of rows) {
    if (value === undefined || value === null || value === "") continue;
    dl.append(el("dt", label), el("dd", value));
  }
  return dl;
}

function setStatus(message) {
  document.getElementById("status").textContent = message || "";
}

async function get(url) {
  const response = await fetch(url);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || "HTTP " + response.status);
  return body;
}

function renderFunnel(data) {
  const c = data.counts;
  document.getElementById("funnel-line").textContent =
    c.notices + " \u2192 " + c.g1 + " \u2192 " + c.g2 + " \u2192 " + c.g3 + " + " + c.cannot_decide;
  document.getElementById("funnel").replaceChildren(
    list([
      ["Ilmoituksia", c.notices],
      ["G1 kaistaosuma", c.g1],
      ["G2 n\u00e4kyy Suomesta", c.g2],
      ["G3 laskettu", c.g3],
      ["Ei p\u00e4\u00e4tett\u00e4viss\u00e4", c.cannot_decide],
      ["Rajanylitys", c.exceeds],
      ["L\u00e4hell\u00e4 rajaa", c.near],
      ["Selv\u00e4t", c.clear],
    ]),
    el("h3", "Pudotukset"),
    list(Object.entries(data.drops)),
    el("h3", "Ajo"),
    list([
      ["Tila", data.mode],
      ["S\u00e4\u00e4nn\u00f6t", data.rules_version],
      ["Aika", data.run_at],
      ["Aineiston SHA256", data.input_sha256],
    ]),
  );
}

function renderQueue(items) {
  const ul = document.getElementById("queue");
  if (!items.length) {
    ul.replaceChildren(el("li", "Jono on tyhj\u00e4."));
    return;
  }
  ul.replaceChildren(
    ...items.map((item) => {
      const li = el("li");
      const button = el("button", null, "queue-item");
      button.type = "button";
      button.dataset.caseId = item.case_id;
      button.append(
        el("span", item.case_id),
        el("span", item["class"], "klass " + item["class"]),
        el("span", num(item.calculation && item.calculation.margin_db, "dB"), "margin"),
      );
      button.addEventListener("click", () => showCase(item.case_id));
      li.append(button);
      return li;
    }),
  );
}

function markCurrent(caseId) {
  for (const button of document.querySelectorAll("button.queue-item")) {
    button.setAttribute("aria-current", String(button.dataset.caseId === caseId));
  }
}

function renderCard(item) {
  const c = item.calculation || {};
  const band = item.band || {};
  const coverage = item.coverage || {};
  const victim = item.victim || {};
  document.getElementById("card").replaceChildren(
    list([
      ["Tunniste", item.case_id],
      ["Luokka", item["class"]],
      ["Hallinto", item.parties && item.parties.admin],
      ["Satelliitti", [coverage.sat_name, coverage.orbit].filter(Boolean).join(" / ")],
      ["Keila", coverage.beam],
      ["Kaista", num(band.freq_min_mhz) + " - " + num(band.freq_max_mhz) + " MHz"],
      ["Suunta", item.direction],
      ["Peitto", coverage.coverage_hint],
      ["Vastaanottoasema", victim.station ? victim.station + " (" + victim["class"] + ")" : null],
      ["PFD", num(c.pfd_dbw_m2_hz, "dB(W/m\u00b2/Hz)")],
      ["Raja", num(c.limit_dbw_m2_hz, "dB(W/m\u00b2/Hz)")],
      ["Marginaali", num(c.margin_db, "dB")],
      ["Et\u00e4isyys", num(c.distance_km, "km")],
      ["Perigeum", num(c.perigee_km, "km")],
      ["Suomessa M4", item.m4 && item.m4.services_in_finland],
      ["Puuttuu", (item.missing || []).join(", ")],
    ]),
    el("h3", "Kysymys vastapuolelle"),
    el("p", item.next_action && item.next_action.question),
    el("h3", "Seloste"),
    el("pre", item.prose && item.prose.text),
  );
}

async function showCase(caseId) {
  markCurrent(caseId);
  setStatus("Ladataan korttia " + caseId + "...");
  try {
    renderCard(await get("/api/cases/" + encodeURIComponent(caseId)));
    setStatus("");
  } catch (error) {
    setStatus("Korttia ei saatu: " + error.message);
  }
}

async function start() {
  try {
    renderFunnel(await get("/api/funnel"));
    renderQueue(await get("/api/queue"));
    setStatus("");
  } catch (error) {
    setStatus("Aineistoa ei saatu: " + error.message);
    document.getElementById("funnel-line").textContent = "ei aineistoa";
  }
}

start();
</script>
</html>
