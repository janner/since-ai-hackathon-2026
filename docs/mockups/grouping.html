<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaista · ryhmittely</title>
<style>
  :root {
    --bg: #ffffff; --fg: #161616; --muted: #525252; --line: #e0e0e0;
    --surface: #f4f4f4; --accent: #0f62fe; --accent-hover: #0043ce; --tint: #edf5ff;
    --warn: #a2191f; --warn-bg: #fff1f1;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    height: 760px; display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 400 14px/1.45 var(--sans); font-variant-numeric: tabular-nums;
  }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 20px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .controls label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  select, button { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); min-height: 32px; padding: 4px 8px; }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 27rem; min-height: 0; }
  #left { padding: 14px 20px 24px; overflow: auto; min-height: 0; }
  #detail { border-left: 1px solid var(--line); background: var(--surface); padding: 14px 16px 24px; overflow: auto; min-height: 0; }
  h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; line-height: 1.25; }
  h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  p { margin: 0 0 8px; }
  .view-head { margin: 0 0 10px; }
  .view-note { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .warn-note { color: var(--warn); background: var(--warn-bg); font-size: 12px; padding: 6px 8px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .m { font-weight: 600; white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 24px; font-size: 11px; line-height: 1.45; white-space: nowrap; }
  .t-exceeds { background: var(--tint); color: var(--accent); }
  .t-near { background: var(--surface); color: var(--fg); }
  .t-not_space { background: var(--warn-bg); color: var(--warn); }
  .t-clear { background: var(--surface); color: var(--muted); }
  .linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; min-height: 0; font-size: 12px; }
  .linkbtn:hover { color: var(--accent-hover); text-decoration: underline; }
  .chip { border: 1px solid var(--accent); color: var(--accent); background: var(--tint); border-radius: 24px; min-height: 28px; padding: 2px 10px; cursor: pointer; font-size: 12px; margin: 0 0 8px; }
  .group { border: 1px solid var(--line); margin: 0 0 8px; }
  .group-head { width: 100%; display: grid; grid-template-columns: 1.25rem minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; background: var(--bg); border: 0; padding: 9px 11px; cursor: pointer; font: inherit; }
  .group-head:hover { background: var(--surface); }
  .chev { color: var(--muted); font-size: 12px; }
  .group-name { display: block; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .group-meta { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; overflow-wrap: anywhere; }
  .group-facts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .child-row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: start; text-align: left; background: var(--bg); border: 0; border-top: 1px solid var(--line); padding: 8px 11px; cursor: pointer; font: inherit; }
  .child-row.single { border: 1px solid var(--line); margin: 0 0 8px; }
  .child-row.single:hover { background: var(--surface); }
  .child-row:hover { background: var(--surface); }
  .child-row[aria-current="true"] { background: var(--tint); box-shadow: inset 3px 0 0 var(--accent); }
  .child-main { min-width: 0; }
  .child-title { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .child-meta { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; overflow-wrap: anywhere; }
  .child-status { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .child-dl { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
  .child-dl.passed { color: var(--warn); font-weight: 600; }
  .child-extra { grid-column: 1 / -1; display: none; color: var(--muted); font-size: 12px; border-top: 1px dotted var(--line); padding-top: 3px; margin-top: 1px; }
  body[data-density="compact"] .child-meta { display: none; }
  body[data-density="detailed"] .child-extra { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: var(--bg); font-weight: 600; cursor: pointer; white-space: nowrap; z-index: 1; }
  th.num, td.num { text-align: right; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--surface); }
  tr.row[aria-current="true"] { background: var(--tint); }
  .mono { font-family: var(--mono); font-size: 11px; }
  .col-picker { margin: 0 0 8px; }
  .col-picker summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  .col-box { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 0 2px; font-size: 12px; }
  .col-box label { display: inline-flex; gap: 4px; align-items: center; color: var(--fg); }
  .pivot { border: 1px solid var(--line); }
  .pivot th, .pivot td { border: 1px solid var(--line); text-align: center; }
  .pivot th:first-child, .pivot td:first-child { text-align: left; }
  .pivot td.count { cursor: pointer; font-weight: 600; color: var(--accent); background: var(--tint); }
  .pivot td.zero { color: var(--muted); }
  .pivot tr.total-row td { font-weight: 600; background: var(--surface); }
  .inline { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .tl-axis, .tl-row { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 10px; align-items: center; }
  .tl-axis { margin-top: 8px; }
  .tl-label { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .tl-ticks { position: relative; height: 18px; }
  .tl-ticks span { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .tl-row { padding: 7px 0; border-top: 1px solid var(--line); }
  .tl-track { position: relative; height: 26px; }
  .tl-track::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; border-top: 1px solid var(--line); }
  .tl-dot { position: absolute; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); transform: translateX(-50%); border: 2px solid var(--bg); }
  .tl-dot.passed { background: var(--warn); }
  .no-dl { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .card { background: var(--bg); border: 1px solid var(--line); padding: 14px 16px; }
  .card-header { margin: 0 0 12px; }
  .card-title { margin: 0 0 3px; font-size: 18px; }
  .card-sub { margin: 0; color: var(--muted); font-size: 12px; }
  .card-section { margin: 0 0 14px; }
  .card-section:last-child { margin-bottom: 0; }
  .prose p { margin: 0 0 7px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: minmax(7rem, auto) minmax(0, 1fr); gap: 3px 10px; margin: 0; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  .question { margin: 6px 0; font-size: 13px; }
  .copy { min-height: 30px; padding: 3px 10px; cursor: pointer; color: var(--accent); border-color: var(--accent); background: var(--tint); font-size: 12px; }
  .copy:hover { background: var(--accent); color: #fff; }
  #status { font-size: 12px; color: var(--accent); min-height: 18px; margin: 4px 0 0; }
  footer { border-top: 1px solid var(--line); padding: 8px 20px; color: var(--muted); font-size: 11px; }
  @media (max-width: 1000px) {
    body { height: auto; min-height: 760px; overflow: auto; }
    main { grid-template-columns: 1fr; }
    #detail { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>

    <label>Kortin osat

</header>
<main>

    <div id="card"></div>
  </aside>
</main>

  const dl = el("span", c.deadline ? "DL " + c.deadline : "—", "child-dl" + (c.deadline_passed ? " passed" : ""));
  const extra = el("span", ["PFD " + num(c.pfd, "dB(W/m²/Hz)"), "raja " + num(c.limit, "dB(W/m²/Hz)"), "korkeus " + num(c.elevation, "°"), c.victim_station ? "uhri " + c.victim_station : ""].filter(Boolean).join(" · "), "child-extra");
  row.append(main, status, dl, extra);
  row.addEventListener("click", () => selectCase(c.id));
  return row;
}

function renderTable() {
  const cols = currentColumns();
  const rows = sortCases(filteredCases());
  const root = document.getElementById("view-root");
  const head = el("div", null, "view-head");
  head.append(el("h2", "Taulukko"));
  head.append(el("p", "Sarakeprofiili vaihtaa mitä dataa näytetään. Rivi avaa kortin oikealle.", "view-note"));
  const picker = el("details", null, "col-picker");
  picker.append(el("summary", "Sarakkeet (" + cols.length + ")"));
  const box = el("div", null, "col-box");
  for (const key of ALL_COLUMNS) {
    const label = el("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = cols.includes(key);
    cb.dataset.col = key;
    cb.addEventListener("change", () => {
      state.columns = ALL_COLUMNS.filter(k => {
        const input = box.querySelector('input[data-col="' + k + '"]');
        return input && input.checked;
      });
      state.preset = "free";
      render();
    });
    label.append(cb, document.createTextNode(" " + COLUMNS[key].label));
    box.append(label);
  }
  picker.append(box);
  head.append(picker);
  const table = el("table");
  const thead = el("thead");
  const htr = el("tr");
  for (const key of cols) {
    const th = el("th", COLUMNS[key].label + (state.sort.key === key ? (state.sort.dir > 0 ? " ↑" : " ↓") : ""));
    if (COLUMNS[key].num) th.className = "num";
    th.addEventListener("click", () => {
      if (state.sort.key === key) state.sort.dir *= -1;
      else state.sort = {key, dir: 1};
      renderTable();
    });
    htr.append(th);
  }
  thead.append(htr);
  table.append(thead);
  const tbody = el("tbody");
  for (const c of rows) {
    const row = el("tr", null, "row");
    row.dataset.id = c.id;
    row.setAttribute("aria-current", String(state.selected === c.id));
    for (const key of cols) {
      const td = el("td", COLUMNS[key].text(c));
      if (COLUMNS[key].num) td.className = "num";
      if (COLUMNS[key].mono) td.classList.add("mono");
      row.append(td);
    }
    row.addEventListener("click", () => selectCase(c.id));
    tbody.append(row);
  }
  table.append(tbody);
  root.replaceChildren(head, table);
}
function sortValue(key, c) {
  if (key === "deadline") return c.deadline_iso || "9999-12-31";
  if (key === "klass") return CLASS_ORDER.indexOf(c.klass);
  if (key === "stage") return stageRank(c) * 100 + c.stage_prov.length;
  const col = COLUMNS[key];
  return col ? col.text(c) : "";
}
function sortCases(list) {
  const s = state.sort;
  if (s.key === "priority") return list.slice().sort(byQueue);
  const col = COLUMNS[s.key];
  if (!col) return list.slice().sort(byQueue);
  return list.slice().sort((a, b) => {
    let va = sortValue(s.key, a), vb = sortValue(s.key, b);
    if (col.num) {
      va = parseFloat(String(va).replace(/\\s/g, "").replace(",", "."));
      vb = parseFloat(String(vb).replace(/\\s/g, "").replace(",", "."));
      if (!isFinite(va)) va = -Infinity;
      if (!isFinite(vb)) vb = -Infinity;
      return (va - vb) * s.dir || byQueue(a, b);
    }
    return String(va).localeCompare(String(vb), "fi") * s.dir || byQueue(a, b);
  });
}

function renderPivot() {
  const dim = state.group;
  const colDim = state.pivotCol;
  const groups = groupBy(dim);
  const cols = colDim === "class"
    ? ["exceeds", "near", "not_space"]
    : [...new Set(CASES.map(stageLabel))].sort((a, b) => {
        const ra = Math.min(...CASES.filter(c => stageLabel(c) === a).map(c => stageRank(c)));
        const rb = Math.min(...CASES.filter(c => stageLabel(c) === b).map(c => stageRank(c)));
        return ra - rb;
      });
  const root = document.getElementById("view-root");
  const head = el("div", null, "view-head");
  head.append(el("h2", "Ristikko"));
  head.append(el("p", "Rivit: " + GROUP_LABEL[dim] + ". Sarakkeet: " + (colDim === "class" ? "luokka" : "vaihe") + ". Solu suodattaa taulukon.", "view-note"));
  const toggle = el("label", null, "inline");
  toggle.append(document.createTextNode("Sarakkeet "));
  const sel = document.createElement("select");
  sel.append(new Option("Luokka", "class"), new Option("Vaihe", "stage"));
  sel.value = colDim;
  sel.addEventListener("change", () => { state.pivotCol = sel.value; renderPivot(); });
  toggle.append(sel);
  head.append(toggle);
  const table = el("table", null, "pivot");
  const thead = el("thead");
  const htr = el("tr");
  htr.append(el("th", GROUP_LABEL[dim]));
  for (const col of cols) htr.append(el("th", colDim === "class" ? classLabel(col) : col));
  htr.append(el("th", "Yhteensä"));
  thead.append(htr);
  table.append(thead);
  const tbody = el("tbody");
  const totals = Object.fromEntries(cols.map(c => [c, 0]));
  for (const g of groups) {
    const tr = el("tr");
    tr.append(el("td", g.name + " (" + g.count + ")", "row-label"));
    for (const col of cols) {
      const n = g.items.filter(c => colDim === "class" ? c.klass === col : stageLabel(c) === col).length;
      totals[col] += n;
      const td = el("td", String(n), n ? "count" : "zero");
      if (n) {
        td.title = "Suodata nämä " + n + " tapausta";
        td.addEventListener("click", () => {
          state.filter = {dim, groupName: g.name, colDim, colValue: col};
          state.view = "table";
          render();
        });
      }
      tr.append(td);
    }
    tr.append(el("td", String(g.count), "total"));
    tbody.append(tr);
  }
  const totalRow = el("tr", null, "total-row");
  totalRow.append(el("td", "Yhteensä"));
  for (const col of cols) totalRow.append(el("td", String(totals[col])));
  totalRow.append(el("td", String(CASES.length)));
  tbody.append(totalRow);
  table.append(tbody);
  root.replaceChildren(head, table);
}

function renderTimeline() {
  const groups = groupBy(state.group);
  const withDl = groups.filter(g => g.deadline);
  const without = groups.filter(g => !g.deadline);
  const deadlineCount = withDl.reduce((n, g) => n + g.items.filter(c => c.deadline).length, 0);
  const root = document.getElementById("view-root");
  const head = el("div", null, "view-head");
  head.append(el("h2", "Aikajana"));
  head.append(el("p", "Res 35 -deadlinet akselilla -14…+90 päivää ajosta " + fmtDate(RUN_AT) + ".", "view-note"));
  if (deadlineCount < CASES.length) {
    head.append(el("p", "Vain " + deadlineCount + " tapauksella " + CASES.length + ":stä on deadline. Aikajana näyttää samalla datan aukon.", "warn-note"));
  }
  const axis = el("div", null, "tl-axis");
  axis.append(el("span", "", "tl-label"));
  const ticks = el("div", null, "tl-ticks");
  for (const t of [-14, 0, 14, 30, 60, 90]) {
    const span = el("span", (t > 0 ? "+" : "") + t);
    span.style.left = ((t + 14) / 104 * 100) + "%";
    ticks.append(span);
  }
  axis.append(ticks);
  const list = el("div");
  for (const g of withDl) {
    const row = el("div", null, "tl-row");
    row.append(el("span", g.name + " (" + countText(g.items.length) + ")", "tl-label"));
    const track = el("div", null, "tl-track");
    for (const c of g.items.filter(c => c.deadline)) {
      const offset = Math.round((Date.parse(c.deadline_iso) - RUN_MS) / 86400000);
      const dot = el("span", "", "tl-dot" + (c.deadline_passed ? " passed" : ""));
      dot.style.left = Math.max(0, Math.min(100, ((offset + 14) / 104) * 100)) + "%";
      dot.title = c.id + " · " + c.deadline + " · " + (offset >= 0 ? "+" + offset + " pv" : offset + " pv");
      track.append(dot);
    }
    row.append(track);
    list.append(row);
  }
  root.replaceChildren(head, axis, list);
  if (without.length) {
    const box = el("div", null, "no-dl");
    box.append(el("h3", "Ei deadlinea (" + countText(without.reduce((n, g) => n + g.count, 0)) + ")"));
    box.append(el("p", "Näille aika ei sido. Ne pysyvät jonossa luokan ja vaiheen mukaan.", "view-note"));
    root.append(box);
  }
}

function selectCase(id) {
  state.selected = id;
  for (const node of document.querySelectorAll("[data-id]")) {
    node.setAttribute("aria-current", String(node.dataset.id === id));
  }
  renderCard();
}
function kv(pairs) {
  const dl = el("dl", null, "kv");
  for (const [k, v] of pairs) {
    if (v === null || v === undefined || v === "") continue;
    dl.append(el("dt", k), el("dd", v));
  }
  return dl;
}
function cardHeader(c) {
  const box = el("div", null, "card-header");
  box.append(el("h2", (c.sat || c.id) + " · " + adminName(c.admin), "card-title"));
  box.append(el("p", [c.id, c.band_label, classLabel(c.klass), signed(c.margin, "dB")].join(" · "), "card-sub"));
  return box;
}
function cardSection(key, c) {
  const box = el("section", null, "card-section");
  if (key === "summary") {
    box.append(el("h3", "Mitä tämä tarkoittaa"));
    if (c.prose) {
      const prose = el("div", null, "prose");
      const text = c.prose.split("\n").filter(line => !line.trim().startsWith("#")).join("\n");
      for (const p of text.split(/\n{2,}/).map(s => s.trim()).filter(Boolean)) prose.append(el("p", p));
      box.append(prose);
    }
  } else if (key === "calc") {
    box.append(el("h3", "Laskenta"));
    box.append(kv([
      ["PFD", num(c.pfd, "dB(W/m²/Hz)")],
      ["Raja", num(c.limit, "dB(W/m²/Hz)")],
      ["Marginaali", signed(c.margin, "dB")],
      ["Lähetysteho (PSD)", num(c.psd, "dBW/Hz")],
      ["Keilan vahvistus", num(c.beam_gain, "dBi")],
      ["FSPL", num(c.fspl, "dB")],
      ["Etäisyys", num(c.distance, "km")],
      ["Korkeus", num(c.elevation, "°")],
      ["Kaava", "PFD = PSD + keilan vahvistus - FSPL; raja = taulukon 21-4 arvo korkeudella."],
      ["Rajan lähde", c.limit_source || "—"]
    ]));
  } else if (key === "reg") {
    box.append(el("h3", "Sääntely"));
    box.append(kv([
      ["Vaihe", stageLabel(c) + (c.stage_label ? " · " + c.stage_label : "")],
      ["Toiminto", actionLabel(c.action)],
      ["Deadline", c.deadline ? c.deadline + (c.deadline_passed ? " (mennyt)" : "") : "—"],
      ["Seuraa", (c.filing_follows || []).join(", ") || "—"],
      ["Puuttuva tieto", (c.missing || []).filter(f => !String(f).startsWith("s_beam.")).join(", ") || "ei puutteita"],
      ["Huom", c.threshold_note || "—"],
      ["Viereinen kanava", c.adjacent ? "kyllä, luokka rajattu near-tasolle" : "ei"]
    ]));
    if (c.question) {
      box.append(el("p", c.question, "question"));
      const btn = el("button", "Kopioi kysymys", "copy");
      btn.type = "button";
      btn.addEventListener("click", () => copyText(c.question, btn));
      box.append(btn);
    }
  } else if (key === "network") {
    box.append(el("h3", "Verkko"));
    box.append(kv([
      ["Satelliitti", c.sat || "—"],
      ["Hallinto", adminName(c.admin)],
      ["Verkon organisaatio", c.network_org || "—"],
      ["Rata", c.orbit || "—"],
      ["Pituusaste", c.longitude !== null && c.longitude !== undefined ? num(c.longitude, "°") : "—"],
      ["Keila", c.beam || "—"],
      ["Keilan geometria", c.beam_geometry || "—"],
      ["Kattavuus", c.coverage_hint || "—"],
      ["Piste", c.point_lat !== null && c.point_lat !== undefined ? num(c.point_lat, "N") + ", " + num(c.point_lon, "E") + " (" + (c.point_place || "") + ")" : (c.point_place || "—")],
      ["Samat verkot", (c.same_network || []).join(", ") || "—"]
    ]));
  } else if (key === "victim") {
    box.append(el("h3", "Uhri"));
    box.append(kv([
      ["Asema", c.victim_station || "ei uhriasemaa"],
      ["Luokka", c.victim_class || "—"],
      ["RX", num(c.victim_rx, "MHz")],
      ["Vahvistus", num(c.victim_gain, "dBi")],
      ["Teho", num(c.victim_power, "W")],
      ["Suunta", num(c.victim_direction, "°")],
      ["Suuntaavuus", c.victim_directivity || "—"],
      ["Koordinaatit", c.victim_lat !== null && c.victim_lat !== undefined ? num(c.victim_lat, "N") + ", " + num(c.victim_lon, "E") : "—"],
      ["M4-palvelut", c.m4 || "—"],
      ["Satelliittikäyttö Suomessa", c.m4_satellite === false ? "ei" : c.m4_satellite === true ? "kyllä" : "—"]
    ]));
  } else if (key === "source") {
    box.append(el("h3", "Lähde"));
    box.append(kv([
      ["Tiedosto", c.source_file || "—"],
      ["IFIC", c.source_ific || "—"],
      ["SHA256", c.source_sha ? c.source_sha.slice(0, 12) + "…" + c.source_sha.slice(-4) : "—"],
      ["Säännöt", c.rules_version || "—"],
      ["Ajo", fmtDate(c.run_at)],
      ["Taulut", (c.source_tables || []).join(", ") || "—"],
      ["Avaimet", [c.source_ntc ? "ntc " + c.source_ntc : "", c.source_grp ? "grp " + c.source_grp : "", c.source_beam ? "beam " + c.source_beam : ""].filter(Boolean).join(" · ") || "—"]
    ]));
  }
  return box;
}
function renderCard() {
  const root = document.getElementById("card");
  if (!state.selected) { root.replaceChildren(el("p", "Valitse tapaus vasemmalta.", "muted")); return; }
  const c = CASES.find(x => x.id === state.selected);
  if (!c) { root.replaceChildren(el("p", "Tapausta ei löytynyt.", "muted")); return; }
  const order = CARD_ORDERS[state.cardOrder] || CARD_ORDERS.process;
  const article = el("article", null, "card");
  article.append(cardHeader(c));
  for (const key of order) {
    if (state.density !== "detailed" && key === "source") continue;
    article.append(cardSection(key, c));
  }
  root.replaceChildren(article);
}

function applyProfile(name) {
  state.preset = name;
  const p = PROFILES[name];
  if (p) {
    state.group = p.group;
    state.density = p.density;
    state.cardOrder = p.card;
    if (p.columns) state.columns = p.columns.slice();
  }
  resetExpanded();
  render();
}
function start() {
  resetExpanded();
  state.selected = CASES.slice().sort(byQueue)[0]?.id || null;
  document.getElementById("run-line").textContent =
    "Staattinen demo: out/cases.json · " + CASES.length + " kortillista tapausta" +
    (CLEAR_COUNT ? " · " + CLEAR_COUNT + " clear ei näytetä" : "");
  render();
}

document.getElementById("view").addEventListener("change", e => { state.view = e.target.value; render(); });
document.getElementById("group").addEventListener("change", e => { state.group = e.target.value; state.preset = "free"; resetExpanded(); render(); });
document.getElementById("density").addEventListener("change", e => { state.density = e.target.value; state.preset = "free"; render(); });
document.getElementById("preset").addEventListener("change", e => applyProfile(e.target.value));
document.getElementById("cardorder").addEventListener("change", e => { state.cardOrder = e.target.value; state.preset = "free"; render(); });
start();
</script>
</body>
</html>
