[project]
name = "sinceai-2026"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "openpyxl>=3.1.5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["data: needs the real challenge data in data/ (skipped when it is missing)"]

[tool.ruff]
line-length = 100
extend-exclude = ["data", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
